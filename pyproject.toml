[project]
name = "wordvec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "joel berman", email = "joel.berman@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "gensim>=4.4.0",
    "gunicorn>=26.2.0",
    "jieba>=0.42.1",
    "numpy>=2.5.4",
]

[project.scripts]
wordvec = "wordvec:main"
wordvec-zh = "wordvec.chinese:main"
wordvec-web = "wordvec.web:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
